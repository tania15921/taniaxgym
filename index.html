<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gym Links</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --grad-start: #5B3A45;
            --grad-mid: #8C5B62;
            --grad-end: #C79A92;
            --cream: #FBF6F2;
            --ink: #2C2321;
            --muted: #D9C4BE;
            --accent: #C79A92;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(165deg, var(--grad-start) 0%, var(--grad-mid) 55%, var(--grad-end) 100%);
            color: var(--cream);
            font-family: 'Inter', system-ui, sans-serif;
            display: flex;
            justify-content: center;
            padding: 52px 18px 70px;
        }

        .page {
            width: 100%;
            max-width: 420px;
        }

        /* HERO */
        .hero {
            text-align: center;
            margin-bottom: 38px;
        }

        .mark {
            width: 150px;
            height: 150px;
            margin: 0 auto 22px;
            border-radius: 50%;
            object-fit: cover;
            object-position: center;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.5);
            display: block;
        }

        h1 {
            font-family: 'Cormorant Garamond', serif;
            font-weight: 600;
            font-size: 40px;
            line-height: 1.05;
            letter-spacing: 0.3px;
            margin: 0 0 10px;
            color: #fff;
        }

        .tagline {
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            color: var(--muted);
            font-size: 15px;
            letter-spacing: 0.3px;
        }

        /* SECTION LABEL */
        .section-label {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--muted);
            text-align: center;
            margin: 0 0 16px;
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 36px 0 18px;
        }

        .divider::before,
        .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: rgba(255, 255, 255, 0.25);
        }

        .divider .dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: var(--cream);
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .link-btn {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 15px 18px;
            background: var(--cream);
            border-radius: 14px;
            text-decoration: none;
            color: var(--ink);
            font-weight: 500;
            font-size: 15px;
            box-shadow: 0 8px 18px rgba(43, 20, 20, 0.18);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        .link-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 22px rgba(43, 20, 20, 0.26);
        }

        .link-btn:focus-visible {
            outline: 2px solid #fff;
            outline-offset: 2px;
        }

        .icon-badge {
            width: 34px;
            height: 34px;
            border-radius: 10px;
            background: rgba(140, 91, 98, 0.1);
            color: var(--grad-mid);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .icon-badge svg {
            width: 17px;
            height: 17px;
        }

        .label-group {
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .label-group .tag {
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            color: var(--grad-mid);
            margin-top: 1px;
        }

        .chevron {
            color: #C9BAB5;
            flex-shrink: 0;
        }

        .chevron svg {
            width: 16px;
            height: 16px;
        }

        footer {
            text-align: center;
            margin-top: 46px;
            color: var(--muted);
            font-size: 11px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        @media (prefers-reduced-motion: reduce) {
            .link-btn {
                transition: none;
            }
        }
    </style>
</head>
